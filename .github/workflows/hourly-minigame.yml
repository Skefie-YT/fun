name: Hourly Browser Mini-Game

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      theme:
        description: 'Optional game idea or theme (leave blank for random)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: hourly-minigame
  cancel-in-progress: false

jobs:
  generate-game:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate new mini-game
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GAME_THEME: ${{ github.event.inputs.theme || '' }}
        run: python .github/scripts/generate_game.py

      - name: Commit and push new game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games games.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          SLUG=$(git status --porcelain games/ | head -n1 | sed -E 's|.*games/([^/]+)/.*|\1|')
          git commit -m "Add AI mini-game: ${SLUG:-new-game}"
          git push
