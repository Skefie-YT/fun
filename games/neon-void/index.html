<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Neon Void</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}body{background:#0a0a0f;color:#fff;font-family:'Orbitron',sans-serif;overflow:hidden;height:100dvh}#game-container{position:relative;width:100%;height:100%;max-width:600px;margin:0 auto;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:0;left:0;width:100%;padding:15px;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none}.hud div,.hud a,.hud button{pointer-events:auto;text-shadow:0 0 10px #8B5CF6}.back-btn{color:#fff;text-decoration:none;font-size:14px;border:1px solid #8B5CF6;padding:4px 10px;border-radius:4px;background:rgba(139,92,246,0.2)}.scores{text-align:center}.info-btn{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;line-height:1}.overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20;padding:20px;text-align:center}.overlay h1{font-size:48px;color:#8B5CF6;margin-bottom:10px;text-shadow:0 0 20px #8B5CF6}.overlay p{margin-bottom:20px;line-height:1.6;max-width:300px}.btn-start{background:#8B5CF6;border:none;color:#fff;padding:15px 40px;font-size:20px;font-family:'Orbitron';cursor:pointer;border-radius:50px;box-shadow:0 0 20px #8B5CF6;transition:transform 0.1s}.btn-start:active{transform:scale(0.95)}.hidden{display:none!important}.controls-hint{position:absolute;bottom:20px;font-size:12px;opacity:0.6;pointer-events:none}</style></head><body><div id="game-container"><div class="hud"><a href="../../" class="back-btn">Back</a><div class="scores">SCORE: <span id="current-score">0</span><br><small>BEST: <span id="best-score">0</span></small></div><button class="info-btn" id="info-toggle">?</button></div><canvas id="gameCanvas"></canvas><div id="start-screen" class="overlay"><h1>NEON VOID</h1><p>Dodge the pulses. Survive the void.</p><button class="btn-start" onclick="startGame()">INITIALIZE</button><div class="controls-hint">DRAG or ARROW KEYS to move</div></div><div id="info-screen" class="overlay hidden"><h2>HOW TO PLAY</h2><p>Move your vessel to avoid the approaching energy walls. The void accelerates as your score climbs.</p><button class="btn-start" onclick="toggleInfo()">GOT IT</button></div><div id="game-over" class="overlay hidden"><h1>CRASHED</h1><p id="final-score-msg">Final Score: 0</p><button class="btn-start" onclick="startGame()">RETRY</button></div></div><script>const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');const scoreEl=document.getElementById('current-score');const bestEl=document.getElementById('best-score');const startScreen=document.getElementById('start-screen');const infoScreen=document.getElementById('info-screen');const gameOverScreen=document.getElementById('game-over');const finalScoreMsg=document.getElementById('final-score-msg');let width,height,gameState='menu',score=0,best=0,player,walls=[],particles=[],keys={},lastTime=0,speedMult=1;const SLUG='neon-void';class Player{constructor(){this.size=20;this.x=width/2;this.y=height*0.8;this.targetX=this.x}update(){if(keys['ArrowLeft'])this.targetX-=7;if(keys['ArrowRight'])this.targetX+=7;this.x+=(this.targetX-this.x)*0.2;this.x=Math.max(this.size,Math.min(width-this.size,this.x))}draw(){ctx.shadowBlur=15;ctx.shadowColor='#8B5CF6';ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(this.x,this.y-this.size);ctx.lineTo(this.x-this.size,this.y+this.size);ctx.lineTo(this.x+this.size,this.y+this.size);ctx.fill();ctx.shadowBlur=0}}class Wall{constructor(){this.h=20;this.y=-this.h;this.speed=4*speedMult;const gapSize=width*0.35;this.gapX=Math.random()*(width-gapSize);this.gapW=gapSize;this.passed=false}update(){this.y+=this.speed;if(!this.passed&&this.y>player.y){this.passed=true;score++;scoreEl.innerText=score;speedMult+=0.01}return this.y<height}draw(){ctx.fillStyle='#8B5CF6';ctx.shadowBlur=10;ctx.shadowColor='#8B5CF6';ctx.fillRect(0,this.y,this.gapX,this.h);ctx.fillRect(this.gapX+this.gapW,this.y,width-(this.gapX+this.gapW),this.h);ctx.shadowBlur=0}}function resize(){width=canvas.width=canvas.offsetWidth;height=canvas.height=canvas.offsetHeight;if(player)player.x=width/2}window.addEventListener('resize',resize);resize();best=localStorage.getItem('fun_arcade_highscore_'+SLUG)||0;bestEl.innerText=best;window.addEventListener('keydown',e=>keys[e.key]=true);window.addEventListener('keyup',e=>keys[e.key]=false);canvas.addEventListener('mousemove',e=>{if(gameState==='playing')player.targetX=e.offsetX});canvas.addEventListener('touchmove',e=>{if(gameState==='playing'){e.preventDefault();player.targetX=e.touches[0].clientX-canvas.getBoundingClientRect().left}},{passive:false});document.getElementById('info-toggle').onclick=toggleInfo;function toggleInfo(){infoScreen.classList.toggle('hidden')}function startGame(){score=0;speedMult=1;walls=[];particles=[];scoreEl.innerText='0';player=new Player();gameState='playing';startScreen.classList.add('hidden');gameOverScreen.classList.add('hidden');requestAnimationFrame(loop)}function loop(t){if(gameState!=='playing')return;const dt=t-lastTime;lastTime=t;ctx.fillStyle='#000';ctx.fillRect(0,0,width,height);for(let i=0;i<5;i++){ctx.fillStyle='rgba(139,92,246,0.1)';ctx.fillRect(Math.random()*width,Math.random()*height,2,2)}if(walls.length===0||walls[walls.length-1].y>height*0.4){walls.push(new Wall())}player.update();player.draw();walls=walls.filter(w=>{w.update();w.draw();const hitWall=(player.x-10<w.gapX||player.x+10>w.gapX+w.gapW);if(hitWall&&Math.abs(player.y-w.y)<20)endGame();return w.y<height});requestAnimationFrame(loop)}function endGame(){gameState='menu';if(score>best){best=score;localStorage.setItem('fun_arcade_highscore_'+SLUG,best);bestEl.innerText=best}finalScoreMsg.innerText='Final Score: '+score;gameOverScreen.classList.remove('hidden')}</script></body></html>
