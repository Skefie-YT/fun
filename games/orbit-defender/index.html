<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Orbit Defender</title><style>body{margin:0;overflow:hidden;background:#1a1a1a;font-family:sans-serif;color:white;user-select:none}#game-ui{position:absolute;top:0;width:100%;display:flex;justify-content:space-between;padding:15px;box-sizing:border-box;pointer-events:none;z-index:10}.back-btn{pointer-events:auto;background:#E85D04;color:white;text-decoration:none;padding:5px 15px;border-radius:4px}#canvas{display:block}#overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;padding:20px}button{background:#E85D04;border:none;color:white;padding:15px 30px;font-size:18px;border-radius:8px;cursor:pointer;margin-top:20px}</style></head><body><div id='game-ui'><a href='../../' class='back-btn'>Back</a><div>Score: <span id='score'>0</span> | Best: <span id='best'>0</span></div><button onclick='toggleHelp()' style='padding:5px 15px;margin:0'>?</button></div><div id='overlay'><h1>Orbit Defender</h1><p id='msg'>Rotate the ring to deflect incoming pulses. Don't let them hit the core!</p><button onclick='startGame()'>Play Game</button></div><canvas id='canvas'></canvas><script>const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),slug='orbit-defender';let score=0,best=localStorage.getItem('fun_arcade_highscore_'+slug)||0,playing=false,angle=0,entities=[],time=0;bestEl.textContent=best;function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}window.addEventListener('resize',resize);resize();function toggleHelp(){alert('Rotate with Mouse/Touch/Arrow Keys. Deflect incoming spheres before they reach the core!')}function startGame(){score=0;entities=[];time=0;playing=true;document.getElementById('overlay').style.display='none';scoreEl.textContent=0;requestAnimationFrame(loop)}function spawn(){if(Math.random()<0.02 + (time/5000)){entities.push({x:Math.random()*2-1,y:Math.random()*2-1,dist:Math.max(canvas.width,canvas.height)/2})}}function loop(){if(!playing)return;ctx.clearRect(0,0,canvas.width,canvas.height);time++;spawn();let cx=canvas.width/2,cy=canvas.height/2;ctx.strokeStyle='#E85D04';ctx.lineWidth=8;ctx.beginPath();ctx.arc(cx,cy,50,angle,angle+Math.PI/2);ctx.stroke();entities.forEach((e,i)=>{e.dist-=2;let ex=cx+e.x*e.dist,ey=cy+e.y*e.dist;ctx.fillStyle='white';ctx.beginPath();ctx.arc(ex,ey,10,0,Math.PI*2);ctx.fill();if(e.dist<60){let d=Math.atan2(ey-cy,ex-cx);let diff=Math.abs((d-angle+Math.PI*2)%(Math.PI*2));if(diff<Math.PI/2+0.2){entities.splice(i,1);score++;scoreEl.textContent=score;if(score>best){best=score;localStorage.setItem('fun_arcade_highscore_'+slug,best);bestEl.textContent=best}}else if(e.dist<30){playing=false;document.getElementById('overlay').style.display='flex';document.getElementById('msg').textContent='Game Over! Score: '+score}}});requestAnimationFrame(loop)}window.addEventListener('mousemove',e=>angle=Math.atan2(e.clientY-canvas.height/2,e.clientX-canvas.width/2));window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')angle-=0.2;if(e.key==='ArrowRight')angle+=0.2})</script></body></html>
