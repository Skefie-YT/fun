<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gravity Well Defense</title><style>:root{--accent:#8B5CF6;--bg:#0f172a;}body{margin:0;overflow:hidden;background:var(--bg);font-family:system-ui,sans-serif;color:white;touch-action:none;}#ui{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:10;pointer-events:none;}.back-btn{pointer-events:all;padding:8px 16px;background:rgba(255,255,255,0.1);color:white;text-decoration:none;border-radius:4px;}.hud{font-weight:bold;font-size:1.2rem;}.overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);z-index:20;text-align:center;}canvas{display:block;}</style></head><body><div id="ui"><a href="../../" class="back-btn">Back</a><div class="hud">Score: <span id="score">0</span> | Best: <span id="best">0</span></div></div><div id="overlay" class="overlay"><h1>Gravity Well</h1><p>Rotate your shield to block asteroids. Don't let them hit the core!</p><p>Tap/Move Mouse to rotate</p><button id="start-btn" style="padding:15px 30px;font-size:1.2rem;cursor:pointer;">START</button></div><canvas id="gameCanvas"></canvas><script>const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');const scoreEl=document.getElementById('score');const bestEl=document.getElementById('best');const overlay=document.getElementById('overlay');const startBtn=document.getElementById('start-btn');let score=0,best=localStorage.getItem('fun_arcade_highscore_gravity-well-defense')||0,angle=0,gameActive=false,asteroids=[];bestEl.innerText=best;function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}window.addEventListener('resize',resize);resize();window.addEventListener('mousemove',e=>{angle=Math.atan2(e.clientY-canvas.height/2,e.clientX-canvas.width/2);});window.addEventListener('touchmove',e=>{angle=Math.atan2(e.touches[0].clientY-canvas.height/2,e.touches[0].clientX-canvas.width/2);});function spawnAsteroid(){const dist=Math.hypot(canvas.width,canvas.height)/2;const a=Math.random()*Math.PI*2;asteroids.push({x:Math.cos(a)*dist+canvas.width/2,y:Math.sin(a)*dist+canvas.height/2,speed:1+score/1000,angle:a+Math.PI});}function update(){if(!gameActive)return;if(Math.random()<0.02+score/5000)spawnAsteroid();asteroids.forEach((ast,i)=>{ast.x+=Math.cos(ast.angle)*ast.speed;ast.y+=Math.sin(ast.angle)*ast.speed;const d=Math.hypot(ast.x-canvas.width/2,ast.y-canvas.height/2);if(d<40){const angToAst=Math.atan2(ast.y-canvas.height/2,ast.x-canvas.width/2);if(Math.abs(angToAst-angle)<0.8){asteroids.splice(i,1);score+=10;scoreEl.innerText=score;}else if(d<20){gameOver();}}});requestAnimationFrame(draw);}function draw(){ctx.fillStyle='rgba(15,23,42,0.3)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#8B5CF6';ctx.lineWidth=8;ctx.beginPath();ctx.arc(canvas.width/2,canvas.height/2,50,angle-0.8,angle+0.8);ctx.stroke();ctx.fillStyle='white';asteroids.forEach(a=>{ctx.beginPath();ctx.arc(a.x,a.y,10,0,Math.PI*2);ctx.fill();});update();}function gameOver(){gameActive=false;if(score>best){best=score;localStorage.setItem('fun_arcade_highscore_gravity-well-defense',best);bestEl.innerText=best;}overlay.style.display='flex';}startBtn.onclick=()=>{score=0;asteroids=[];gameActive=true;overlay.style.display='none';requestAnimationFrame(draw);};</script></body></html>
